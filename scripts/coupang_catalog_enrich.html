</style><main><header><div><h1>상품 정보 조사</h1><div class="muted">쿠팡 · 1688 / 가격·별점·배송 정보</div></div><a href="research.xlsx">엑셀 다운로드</a></header><div id="stats" class="stats"></div>
<div class="note">가격·별점·배송 안내는 원본을 관측한 시점의 값입니다. 배송지·회원 상태·옵션에 따라 달라질 수 있습니다. 배지가 없으면 ‘미표시’이며 배송 불가를 뜻하지 않습니다. 별점·리뷰 집계수와 1688 구매 표시는 최근 판매량이 아닙니다. 1688의 숫자 점수는 평가 대상이 확인되지 않아 쿠팡 별점과 구분합니다.</div>
<div class="controls"><label>대상<select id="scope"><option value="winter">겨울 51종 · 쿠팡 후보</option><option value="catalog">쿠팡 전체 수집 카탈로그</option><option value="overseas">1688 후보</option></select></label><label>상품명 / 상품군<input id="query" placeholder="문풍지, 실내화, 상품 ID…"></label><label>배송 배지<select id="rocket"><option value="all">전체</option><option value="rocket">로켓배송 계열</option><option value="seller_rocket">판매자로켓</option><option value="none">로켓 배지 미표시</option></select></label><label>최소 별점<input id="rating" type="number" min="0" max="5" step="0.5" placeholder="전체"></label><label>최소 집계수<input id="reviews" type="number" min="0" placeholder="전체"></label><label>최저 가격<input id="minprice" type="number" min="0" placeholder="원"></label><label>최고 가격<input id="maxprice" type="number" min="0" placeholder="원"></label><label>정렬<select id="sort"><option value="reviews">집계수 많은 순</option><option value="price">가격 낮은 순</option><option value="rating">별점 높은 순</option><option value="title">상품명</option></select></label><button id="reset">초기화</button></div>
<div class="pager"><span class="count" id="count"></span><span><button id="prev">이전</button> <span id="page"></span> <button id="next">다음</button></span></div><div class="tablebox"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><footer>상품 행을 누르면 사진·할인·배송·반품 옵션·관측 시각·원본 링크를 확인할 수 있습니다. 원본 JSON: <a href="enriched-candidates.json">쿠팡 후보</a> · <a href="catalog.jsonl">전체 카탈로그</a> · <a href="overseas-candidates.json">1688 후보</a></footer></main><dialog id="detail"><button class="close" id="close">닫기</button><div id="detailbody"></div></dialog><script id="dataset" type="application/json">__DATA__</script><script>
const DATA=JSON.parse(document.getElementById('dataset').textContent),$=id=>document.getElementById(id),esc=v=>String(v??'미확인').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>v==null?'미확인':Number(v).toLocaleString('ko-KR'),url=v=>/^https?:\/\//.test(v||'')?esc(v):'#',unknown=v=>v==null?'미확인':v===true?'표시됨':v===false?'아니오':esc(v);let page=0,current=[],limit=60;
$('stats').innerHTML=[['겨울 쿠팡 후보',DATA.summary.winter_unique_variants+'개'],['전체 쿠팡 카탈로그',money(DATA.summary.unique_catalog_products)+'개'],['1688 후보 관측',money(DATA.summary.overseas_observations)+'건'],['쿠팡 배송 안내 확보',money(DATA.summary.winter_delivery_available)+'건']].map(([a,b])=>`<div>${a}<b>${b}</b></div>`).join('');
function rocketText(r){return r.rocket_badge_present?r.delivery_badges.join(' · '):'로켓 배지 미표시'}
function render(){const scope=$('scope').value,os=scope==='overseas',q=$('query').value.toLowerCase().trim(),rt=$('rocket').value;for(const id of ['rocket','rating','reviews'])$(id).disabled=os;
current=DATA[scope].filter(r=>{let p=os?r.price_min:r.price;if(q&&![(r.title||''),(r.groups||[]).join(' '),r.group_name||'',r.product_id||''].join(' ').toLowerCase().includes(q))return false;if(!os&&rt!=='all'&&(rt==='none'?r.rocket_badge_present:rt==='rocket'?!r.rocket_badge_present:!(r.rocket_delivery_types||[]).includes(rt)))return false;for(const [id,val,op]of[['minprice',p,1],['maxprice',p,-1],...(!os?[['rating',r.rating,1],['reviews',r.review_count,1]]:[])])if($(id).value!==''&&(val==null||op*Number(val)<op*Number($(id).value)))return false;return true});
const sort=$('sort').value;current.sort((a,b)=>sort==='title'?(a.title||'').localeCompare(b.title||''):sort==='price'?((os?a.price_min:a.price)??Infinity)-((os?b.price_min:b.price)??Infinity):sort==='rating'?(b.rating??-1)-(a.rating??-1):(b.review_count??-1)-(a.review_count??-1));page=Math.max(0,Math.min(page,Math.ceil(current.length/limit)-1));$('count').textContent=money(current.length)+'개 결과';$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(current.length/limit));$('prev').disabled=page===0;$('next').disabled=(page+1)*limit>=current.length;
$('head').innerHTML='<tr>'+['사진','상품명 / 상품군',os?'노출 최저가':'노출가',os?'표시 점수¹':'별점 / 집계수',os?'MOQ / 재구매율':'배송 배지',os?'판매자 / 발송':'도착 / 할인'].map(x=>'<th>'+x+'</th>').join('')+'</tr>';
$('rows').innerHTML=current.slice(page*limit,(page+1)*limit).map((r,i)=>`<tr data-index="${page*limit+i}" tabindex="0" role="button" aria-label="상품 상세 보기"><td><img loading="lazy" src="${url(r.image_url)}" alt="${esc(r.title)}"></td><td class="title"><strong>${esc(r.title)}</strong><div class="muted">${esc((r.groups||[r.group_name]).filter(Boolean).join(' · '))}</div></td><td><b>${money(os?r.price_min:r.price)} ${esc(r.currency||'KRW')}</b>${r.base_price?'<div class="muted">정가 표시 '+money(r.base_price)+'원</div>':''}</td><td>${os?(r.listing_score_untyped==null?'미표시':esc(r.listing_score_untyped)+' (평가 대상 미확인)'):(r.rating==null?'별점 미표시':'★ '+r.rating)+'<div class="muted">집계수 '+money(r.review_count)+'</div>'}</td><td>${os?esc(r.moq_text)+'<div>'+esc(r.repurchase_rate_text)+'</div>':'<span class="badge">'+esc(rocketText(r))+'</span>'}</td><td>${os?esc(r.seller_name_observed)+'<div class="muted">'+esc(r.dispatch_text)+'</div>':esc(r.delivery_text)+(r.discount_rate_percent>0?'<div class="muted">'+r.discount_rate_percent+'% 할인 표시</div>':'')}</td></tr>`).join('');for(const tr of $('rows').children){tr.onclick=()=>detail(current[Number(tr.dataset.index)]);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tr.click()}}}}
function detail(r){const os=$('scope').value==='overseas';const fields=os?[['원본 가격',money(r.price_min)+' '+r.currency],['MOQ',r.moq_text],['판매자 표시명',r.seller_name_observed],['업력 표시',r.seller_years_text],['재구매율 표시',r.repurchase_rate_text],['표시 점수',r.listing_score_untyped==null?'미표시':r.listing_score_untyped+' / 평가 대상 미확인'],['구매 신호',r.purchase_signal_text],['발송 안내',r.dispatch_text],['원본 관측 시각',r.fetched_at],['신호의 한계','판매자 주장·표시이며 진위 및 집계 기간 미확인']]:[['대표 옵션 포함 원문',r.title],['노출가',money(r.price)+'원'],['정가 표시',r.base_price==null?'미표시':money(r.base_price)+'원'],['할인율',r.discount_rate_percent==null?'미표시':r.discount_rate_percent+'%'],['별점',r.rating_raw!=null?'원문 '+r.rating_raw+' / 범위 오류로 유효 별점에서 제외':r.rating],['별점·리뷰 집계수',r.review_count],['배송 배지',rocketText(r)],['도착 안내',r.delivery_text],['무료배송 명시',r.free_shipping_observed?'있음':'미확인'],['배송비 문구',r.shipping_text],['적립 안내',r.cashback_text],['품절 상태',r.sold_out==null?'미확인':r.sold_out?'품절 표시':'품절 아님(관측 시점)'],['반품·중고 옵션',r.used_or_returned_options_text],['반품·중고 최저가',r.used_or_returned_lowest_price==null?'미표시':money(r.used_or_returned_lowest_price)+'원 / 일반 판매가와 별도'],['단위 가격 표시',r.unit_price_text],['itemId / vendorItemId',(r.item_id||'?')+' / '+(r.vendor_item_id||'?')],['판매자명 / 전체 옵션','목록 원본에서 미확인'],['원본 관측 시각',r.observed_at_kst],['적용 한계',r.application_limit]];
$('detailbody').innerHTML=`<h2>${esc(r.title)}</h2><img src="${url(r.image_url)}" alt="상품 사진"><p><a href="${url(os?r.item_url:r.url)}" target="_blank" rel="noreferrer">상품 원문 열기</a> · <a href="${url(r.source_url)}" target="_blank" rel="noreferrer">수집 목록 원문</a></p><dl>${fields.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')}</dl>${os?'<details><summary>관측 원문</summary><pre>'+esc(r.evidence_text)+'</pre></details>':''}`;$('detail').showModal()}
for(const id of ['scope','query','rocket','rating','reviews','minprice','maxprice','sort'])$(id).addEventListener('input',()=>{page=0;render()});$('reset').onclick=()=>{for(const id of ['query','rating','reviews','minprice','maxprice'])$(id).value='';$('rocket').value='all';$('sort').value='reviews';page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('close').onclick=()=>$('detail').close();render();
</script></html>
