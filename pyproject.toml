[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossborder-price-tracker"
version = "1.0.0"
description = "跨境电商多平台价格追踪器"
requires-python = ">=3.9"
dependencies = ["httpx[socks]>=0.27.0", "openpyxl>=3.1,<4", "Pillow>=10"]

[project.scripts]
sourcing-research = "app.sourcing_pipeline:main"
sourcing-agent = "app.sourcing_agent:main"
coupang-review-audit = "app.coupang_reviews:main"
coupang-search-agent = "app.coupang_search_agent:main"
coupang-search-ui = "app.coupang_search_web:main"
sourcing-template-agent = "app.template_excel_agent:main"

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]

[tool.setuptools.package-data]
app = ["coupang_review_extract.js", "coupang_search.html", "catalog_visuals.js"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100
