<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로컬 상세페이지 스튜디오</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#f0eee9;color:#242721}header{padding:18px 24px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0 auto 0 0}button,select,input,textarea{font:inherit;border:1px solid #c8cec3;border-radius:6px;padding:8px;background:#fff;color:inherit}button{cursor:pointer}button.primary{background:#254737;color:white}button:disabled{opacity:.5}main{display:grid;grid-template-columns:minmax(300px,1fr) 360px;gap:20px;max-width:1500px;padding:20px;margin:auto}main>section,aside{min-width:0}aside{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;align-self:start}h2{font-size:16px;margin:12px 0}label{display:block;margin:8px 0}input:not([type=checkbox]),textarea,select{width:100%}textarea{resize:vertical}#stage{position:relative;margin:auto;background:#fff;box-shadow:0 4px 30px #0002;overflow:hidden}iframe{position:absolute;border:0;transform-origin:top left;pointer-events:none}#interaction{position:absolute;inset:0;touch-action:none}#selection{position:absolute;border:2px dashed #24785b;pointer-events:none;display:none}#draw{position:absolute;border:2px dashed #e08019;background:#ffffff66;pointer-events:none;display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{color:#687166;font-size:12px;line-height:1.6}.status{padding:8px 24px;background:#e2e9df;min-height:36px}#error{background:#ffe4da;color:#842815}#layers button{display:block;text-align:left;width:100%;margin:5px 0}#layers button.selected{border:2px solid #24785b}details{margin:12px 0}#exports a{display:block;padding:8px;overflow-wrap:anywhere}#layout-fields[hidden]{display:none}@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}aside{order:-1}header{padding:12px}header button{padding:8px}}
</style>
<header><h1>로컬 상세페이지 스튜디오</h1><button id="save" class="primary">저장</button><button id="export">선택 컷 PNG</button><button id="export-all">전체 PNG</button><button id="json">JSON 다운로드</button></header>
<div id="status" class="status" role="status">불러오는 중</div><div id="error" class="status" role="alert" hidden></div>
<main><section><div id="stage"><iframe id="preview" title="편집 중인 상세페이지"></iframe><div id="interaction"></div><div id="selection"></div><div id="draw"></div></div><div id="exports"></div></section><aside>
<label>편집할 컷<select id="cut"></select></label><details><summary>원본 기획 문구</summary><p id="approved" style="white-space:pre-wrap"></p></details>
<p class="hint">문구 영역을 드래그해 이동하고 모서리로 크기를 조절하세요. 새 이미지는 문구 공간을 비워 생성합니다. 기존 이미지의 글자는 가림 영역으로 처리할 수 있습니다.</p>
<div class="grid"><button id="mask">가릴 영역 그리기</button><button id="add-text">텍스트 추가</button></div>
<label>기획 문구 선택<select id="phrase"></select></label><button id="add-phrase">선택 문구 그대로 추가</button>
<label><input id="show-copy" type="checkbox" checked> 문구 표시 · 해제하면 빈 배경 검토</label><h2>레이어</h2><div id="layers"></div><div id="layout-fields" hidden>
<label id="text-label">문구<textarea id="text" rows="4"></textarea></label><div class="grid"><label>X<input id="x" type="number" min="0"></label><label>Y<input id="y" type="number" min="0"></label><label>폭<input id="width" type="number" min="1"></label><label>높이<input id="height" type="number" min="1"></label></div>
<label>색상<input id="color" type="color"></label><div id="text-options"><div class="grid"><label>글자 크기<input id="font_size" type="number" min="8" max="500"></label><label>최소 크기<input id="min_font_size" type="number" min="8" max="500"></label></div><div class="grid"><label>두께<select id="weight"><option value="400">보통</option><option value="700">굵게</option></select></label><label>정렬<select id="align"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></label></div><label>줄 간격<input id="line_height" type="number" min="1" max="2" step="0.05"></label><label><input id="auto_fit" type="checkbox"> 영역에 맞게 글자 크기 축소</label></div>
<button id="remove">선택 레이어 삭제</button></div><p class="hint">문구를 자동으로 고치거나 추가하지 않습니다. PNG는 현재 저장 버전과 고정된 한글 폰트로 출력합니다. 영역을 벗어난 글자는 내보내기를 중단합니다.</p>
</aside></main>
<script src="/vendor/fabric-6.9.0.min.js"></script><script src="/text-layer-controls.js"></script>
<script>
let doc,rev,token,chosen,selected=null,paint=false,start=null,scale=1,dirty=false;const $=id=>document.getElementById(id),frame=$('preview');
function cut(){return doc.cuts.find(c=>c.id===chosen)}function layer(){return selected&&cut()[selected.collection].find(t=>t.id===selected.id)}
function error(e){$('error').hidden=false;$('error').textContent=String(e.message||e)}function status(s){$('status').textContent=s}
async function api(path,data){let r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Edit-Token':token},body:JSON.stringify(data)}:{});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function fit(){if(!doc)return;scale=Math.min(1,document.querySelector('main section').clientWidth/doc.width);$('stage').style.width=doc.width*scale+'px';$('stage').style.height=doc.height*scale+'px';frame.style.width=doc.width+'px';frame.style.height=doc.height+'px';frame.style.transform='scale('+scale+')';outline();syncControls()}
function outline(){if(controls){$('selection').style.display='none';controls.activate(selected?.collection,selected?.id);return}let t=layer();$('selection').style.display=t?'block':'none';if(t)Object.assign($('selection').style,{left:t.x*scale+'px',top:t.y*scale+'px',width:t.width*scale+'px',height:t.height*scale+'px'})}
let queue=Promise.resolve();function redraw(){let d=JSON.parse(JSON.stringify(doc)),c=d.cuts.find(x=>x.id===chosen);queue=queue.then(async()=>{if(!frame.contentWindow.TextLayers)return;let result=await frame.contentWindow.TextLayers.mount(d,c);let bad=result.metrics.filter(m=>m.overflow);if(bad.length)status('영역 넘침: '+bad.map(m=>m.id).join(', '));}).catch(error);outline()}
function changed(rebuild=true){if(rebuild)syncControls();dirty=true;status('수정 중 · 저장 전');redraw();list()}
function list(){let holder=$('layers');holder.replaceChildren();for(let collection of ['masks','texts'])for(let t of cut()[collection]){let b=document.createElement('button');b.textContent=(collection==='texts'?'글자 · '+t.text.slice(0,25):'가림 · '+t.id);b.className=selected?.id===t.id?'selected':'';b.onclick=()=>select(collection,t.id);holder.append(b)}}
function select(collection,id){selected={collection,id};let t=layer();$('layout-fields').hidden=false;$('text-label').hidden=collection!=='texts';$('text-options').hidden=collection!=='texts';for(let k of ['x','y','width','height','color','text','font_size','min_font_size','weight','align','line_height','auto_fit'])if(k in t){if(k==='auto_fit')$(k).checked=t[k];else $(k).value=t[k]}list();outline()}
function setCut(id){chosen=id;selected=null;$('layout-fields').hidden=true;$('approved').textContent=cut().approved_copy;$('phrase').replaceChildren();for(let t of cut().approved_copy.split('/')){let o=document.createElement('option');o.textContent=t.trim();o.value=t.trim();$('phrase').append(o)}frame.src='/preview/'+encodeURIComponent(chosen);list();fit()}
frame.onload=()=>{redraw();copyVisibility()};window.addEventListener('resize',fit);
for(let k of ['x','y','width','height','color','text','font_size','min_font_size','weight','align','line_height','auto_fit'])$(k).addEventListener('input',()=>{let t=layer();if(!t)return;t[k]=k==='auto_fit'?$(k).checked:['x','y','width','height','font_size','min_font_size','weight','line_height'].includes(k)?Number($(k).value):$(k).value;changed()});
function addText(text){let id='text_'+crypto.randomUUID().replaceAll('-','').slice(0,12);cut().texts.push({id,text,x:100,y:120,width:doc.width-200,height:280,color:'#202820',font_size:68,min_font_size:24,weight:700,align:'center',line_height:1.35,auto_fit:true});select('texts',id);changed()}
$('add-text').onclick=()=>addText('');$('add-phrase').onclick=()=>addText($('phrase').value);$('remove').onclick=()=>{let t=layer();if(!t)return;cut()[selected.collection]=cut()[selected.collection].filter(x=>x!==t);selected=null;$('layout-fields').hidden=true;changed()};
$('mask').onclick=()=>{paint=true;syncControls();$('interaction').style.cursor='crosshair';status('미리보기에서 가릴 영역을 드래그하세요')};
function point(e){let r=$('interaction').getBoundingClientRect();return {x:Math.max(0,Math.min(doc.width,(e.clientX-r.left)/scale)),y:Math.max(0,Math.min(doc.height,(e.clientY-r.top)/scale))}}
$ ('interaction').onpointerdown=e=>{if(!paint)return;start=point(e);$('interaction').setPointerCapture(e.pointerId)};
$('interaction').onpointermove=e=>{if(!start)return;let p=point(e);Object.assign($('draw').style,{display:'block',left:Math.min(p.x,start.x)*scale+'px',top:Math.min(p.y,start.y)*scale+'px',width:Math.abs(p.x-start.x)*scale+'px',height:Math.abs(p.y-start.y)*scale+'px'})};
$('interaction').onpointerup=e=>{if(!start)return;let p=point(e),id='mask_'+crypto.randomUUID().replaceAll('-','').slice(0,12);let m={id,x:Math.round(Math.min(p.x,start.x)),y:Math.round(Math.min(p.y,start.y)),width:Math.floor(Math.abs(p.x-start.x)),height:Math.floor(Math.abs(p.y-start.y)),color:'#ffffff'};start=null;paint=false;$('draw').style.display='none';$('interaction').style.cursor='default';if(m.width>2&&m.height>2){cut().masks.push(m);select('masks',id);changed()}};
async function save(){let r=await api('/api/save',{project:doc,base_revision:rev});rev=r.revision;dirty=false;status('저장됨 · '+rev.slice(0,12));$('error').hidden=true;return r}
$('save').onclick=()=>save().catch(error);async function exportPng(all){let buttons=[$('export'),$('export-all')];try{buttons.forEach(b=>b.disabled=true);await save();status('PNG 출력 중…');let r=await api('/api/render',{cut_id:all?null:chosen});$('exports').replaceChildren();for(let f of r.exports){let a=document.createElement('a');a.href='/'+f.file;a.download=f.cut_id+'.png';a.textContent=f.cut_id+' PNG 다운로드';$('exports').append(a);if(f.html){let h=document.createElement('a');h.href='/'+f.html;h.target='_blank';h.textContent=f.cut_id+' 편집 가능한 HTML';$('exports').append(h)}}status(r.exports.length+'컷 PNG 출력 완료')}catch(e){error(e)}finally{buttons.forEach(b=>b.disabled=false)}}
$('export').onclick=()=>exportPng(false);$('export-all').onclick=()=>exportPng(true);$('json').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}));a.download='project.json';a.click();URL.revokeObjectURL(a.href)};
$('cut').onchange=e=>setCut(e.target.value);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

let controls=new LayerControls($('interaction'),(collection,id,box)=>{
 const t=cut()[collection].find(t=>t.id===id);Object.assign(t,box);selected={collection,id};
 for(const k of ['x','y','width','height'])$(k).value=t[k];changed(false);
},(collection,id)=>select(collection,id));
function syncControls(){if(doc&&chosen)controls.sync(doc,cut(),scale,selected,paint)}
function copyVisibility(){if(!frame.contentDocument?.head)return;let style=frame.contentDocument.getElementById('copy-visibility');if(!style){style=frame.contentDocument.createElement('style');style.id='copy-visibility';frame.contentDocument.head.append(style)}style.textContent=$('show-copy').checked?'':'.text{visibility:hidden!important}'}
$('show-copy').onchange=copyVisibility;

api('/api/project').then(r=>{doc=r.project;rev=r.revision;token=r.token;for(let c of doc.cuts){let o=document.createElement('option');o.value=c.id;o.textContent=c.name+' · '+c.id;$('cut').append(o)}let requested=new URLSearchParams(location.search).get('cut');let first=doc.cuts.some(c=>c.id===requested)?requested:doc.cuts[0].id;$('cut').value=first;setCut(first);status(doc.cuts.length+'컷 · 문구를 선택해 편집하세요')}).catch(error);
</script></html>
