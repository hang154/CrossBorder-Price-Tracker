<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상세페이지 스타일 비교</title><style>*{box-sizing:border-box}body{margin:0;color:#202820;background:#f5f3ee;font:14px system-ui}header{padding:24px;background:white;border-bottom:1px solid #ccc}h1{font-size:24px;margin:0 0 12px}h2{font-size:18px}p{line-height:1.6}nav{display:flex;gap:12px;flex-wrap:wrap}select,button,input,textarea{font:inherit;padding:8px;border:1px solid #bec8be;border-radius:5px;background:white}button{cursor:pointer}main{max-width:1600px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}article{min-width:0;padding:16px;background:white;border:1px solid #ddd}article.recommended{border:2px solid #305640}.image{width:100%;display:block}label{display:block;margin:8px 0}.badge{color:#305640;font-weight:700}.score{font-size:19px;font-weight:700}textarea{width:100%;resize:vertical}details{margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{line-height:1.9}#library{padding:24px;max-width:1500px;margin:auto}#status{min-height:28px}.axes{font-size:12px;color:#59645a}</style>
<header><h1>같은 상품·같은 문구, 8가지 제작 방식</h1><p>배경은 Qwen-Image-2.1, 문구는 편집 가능한 HTML 레이어입니다. 모델 추천과 직접 고른 스타일을 비교하고 기록할 수 있습니다.</p><nav><label>상품 <select id="product"><option value="">전체</option></select></label><label>제작 방식 <select id="method"><option value="">전체</option></select></label><label>유입 맥락 <select id="traffic"><option value="">전체</option></select></label><label>가격 포지션 <select id="price"><option value="">전체</option></select></label><label>구매 불안 <select id="anxiety"><option value="">전체</option></select></label></nav><p class="axes">가격·유입 필터는 스타일의 적용 가설입니다. 실제 가격·유입·전환 성과를 관측한 수치는 아닙니다.</p><div id="status"></div></header><main id="cards"></main><section id="library"><h2>기획 지식과 원본 근거</h2><p id="coverage"></p><p><a href="knowledge/banye/manifest.json">전체 파일·커밋·SHA</a> · <a href="reference-index.json">12분류 레퍼런스 후보</a> · <a href="reference-observations.json">Qwen의 실제 장면 관측</a></p><details><summary>원본 지식 파일과 사례 전체 보기</summary><div id="files"></div></details></section>
<script>
const data=__DATA__;const $=id=>document.getElementById(id);let session=null;
const names=Object.fromEntries(data.jobs.map(j=>[j.product_id,j.product_name]));const methods=Object.fromEntries(data.catalog.methods.map(m=>[m.id,m]));
function option(id,value,label){let o=document.createElement('option');o.value=value;o.textContent=label;$(id).append(o)}
for(const [id,name] of Object.entries(names))option('product',id,name);for(const m of data.catalog.methods)option('method',m.id,m.name);
for(const t of [...new Set(data.catalog.methods.flatMap(m=>m.traffic))])option('traffic',t,t);for(const t of [...new Set(data.catalog.methods.map(m=>m.price_band))])option('price',t,t);for(const t of [...new Set(data.catalog.methods.flatMap(m=>m.anxieties))])option('anxiety',t,t);
function el(tag,text,parent){let n=document.createElement(tag);if(text!==null)n.textContent=text;if(parent)parent.append(n);return n}
function link(label,path,parent){let a=el('a',label,parent);a.href=path;a.target='_blank';return a}
function draw(){
 $('cards').replaceChildren();for(const g of data.comparison.grades){const m=methods[g.method_id];if($('product').value&&$('product').value!==g.product_id||$('method').value&&$('method').value!==g.method_id||$('traffic').value&&!m.traffic.includes($('traffic').value)||$('price').value&&m.price_band!==$('price').value||$('anxiety').value&&!m.anxieties.includes($('anxiety').value))continue;
 const tied=data.comparison.recommended_ties?.[g.product_id]||[];const recommended=data.comparison.recommended[g.product_id]===g.job_id||tied.includes(g.job_id);const card=el('article',null,$('cards'));card.dataset.jobId=g.job_id;card.className=recommended?'recommended':'';
 el('h2',names[g.product_id]+' · '+g.method_name,card);if(recommended)el('p','생성 후 모델 권장'+(tied.length>1?' · 동점 후보':''),card).className='badge';
 const img=el('img',null,card);img.src=g.image;img.className='image';img.loading='lazy';img.alt=g.method_name;
 el('p',g.weighted_score+' / 5 · 모델 디자인 평가'+(g.eligible?'':' · 보완 필요'),card).className='score';el('p',g.reason,card);el('p','설득 흐름: '+m.structure.join(' → '),card).className='axes';
 const links=el('p',null,card);link('PNG',g.image,links);el('span',' · ',links);link('편집 가능한 HTML',g.editable_html,links);el('span',' · ',links);link('레이어 이동·크기 편집','http://127.0.0.1:8777/?cut='+encodeURIComponent(g.job_id),links);el('span',' · ',links);link('생성 기록','evidence/'+g.job_id+'/job.json',links);
 const details=el('details',null,card);el('summary','장단점과 평가 근거',details);el('p','장점: '+g.strengths,details);el('p','보완: '+g.weaknesses,details);el('pre',JSON.stringify(g.scores,null,2),details);
 const label=el('label','내 점수 ',card),score=el('select',null,label);for(let i=5;i>=1;i--){let o=el('option',i+' / 5',score);o.value=i}const note=el('textarea',null,card);note.placeholder='선택 이유나 수정할 부분';note.rows=2;
 const button=el('button','이 스타일 선택·평가 저장',card);button.onclick=async()=>{try{if(!session)throw Error('저장하려면 로컬 비교 서버 주소로 열어주세요.');const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Edit-Token':session.token},body:JSON.stringify({job_id:g.job_id,score:Number(score.value),selected:true,notes:note.value})});if(!r.ok)throw Error('평가 저장 실패');$('status').textContent=names[g.product_id]+' · '+g.method_name+' 선택을 저장했습니다.'}catch(e){$('status').textContent=e.message}};
 }}
for(const id of ['product','method','traffic','price','anxiety'])$(id).onchange=draw;
$('coverage').textContent='Banye 원본 '+data.knowledge.file_count+'개 파일 전체 보존 · 12개 상품군 포트폴리오 관측 · 실제 구매 성과 검증 전';for(const f of data.knowledge.files){let p=el('p',null,$('files'));link(f.path,'knowledge/banye/upstream/'+f.path,p)}
if(location.protocol!=='file:')fetch('/api/session').then(r=>r.ok?r.json():null).then(s=>{session=s;if(s?.reviews.length)$('status').textContent='저장된 평가 '+s.reviews.length+'건'}).catch(()=>{});draw();
</script></html>
