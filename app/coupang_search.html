<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쿠팡 검색 · 리뷰 기반 판매량 추정</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172e40;background:#f3f6fa}body{max-width:1320px;margin:32px auto;padding:0 20px}h1{font-size:30px;margin-bottom:8px}small,.muted{color:#5c6f80}header,form,.panel,article{background:white;border:1px solid #dae3eb;border-radius:12px;padding:20px;margin:16px 0}form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px}label:first-child{flex:1;min-width:220px}input,button,select{font:inherit;padding:11px;border:1px solid #a9bdce;border-radius:7px}button{background:#175a88;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#176fa7;overflow-wrap:anywhere}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}article{margin:0;min-width:0}article h2{font-size:18px}.badge{display:inline-block;border-radius:12px;padding:3px 9px;background:#eaf1f7;font-size:13px}.complete{background:#e0f2e7}.partial,.failed,.interrupted{background:#fff0d6}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.metric{background:#f3f7fa;padding:12px;border-radius:7px}.value{font-size:25px;font-weight:700;display:block}.error{color:#9e3028;white-space:pre-wrap}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #dce5ed;text-align:left}details{margin-top:14px}#history{max-width:100%}#resume{margin-top:12px}.notice{border-left:4px solid #d99d37;padding-left:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:440px){body{padding:0 10px}#cards{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body>
<header><small>로컬 Qwen3.8 uncensored × OpenCLI</small><h1>쿠팡 키워드 검색 · 추정 판매량</h1><p>검색 노출 상위 10개 상품의 최근 1개월·3개월 리뷰를 조사합니다. 상품별 결과는 수집되는 대로 표시됩니다.</p><p class="notice">추정 판매량 = 별점·리뷰를 남긴 중복 제거 관측·추정 참여자 ×15. 실제 주문 수가 아닙니다. 작성자 정보가 마스킹되어 고유 인원은 추정치입니다. 상품 가격은 검색 시 대표 노출가이며, 옵션별 가격과 다를 수 있습니다.</p></header>
<form id="search"><label>상품 키워드<input id="keyword" required maxlength="120" placeholder="예: 여행용 손저울" autocomplete="off"></label><label>상품당 최대 리뷰 페이지<input id="maxPages" type="number" min="1" max="1000" value="100" required></label><button id="submit">상위 10개 조사</button></form>
<div class="panel"><label for="history">최근 작업</label><select id="history"><option value="">작업 선택</option></select><p id="status" role="status" aria-live="polite">검색어를 입력하면 Qwen이 검색·리뷰 수집 도구를 실행합니다.</p><p id="period" class="muted"></p><p id="error" class="error"></p><button id="resume" hidden>완료된 결과 보존 · 미완료 상품 재시도</button><details><summary>모델·도구 실행 근거</summary><pre id="provenance"></pre></details></div>
<div id="cards"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'미확인').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={queued:'대기 중',running:'수집 중',waiting:'수집 대기',complete:'기간·별점 포함 확인',partial:'부분 수집',failed:'수집 실패',interrupted:'중단됨'};
let csrf='',jobId=new URL(location).searchParams.get('job')||'',timer=null;
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw new Error(data.error||r.status);return data;}
function windowText(w){return w?`${esc(w.participants_observed_or_inferred)}명 ×15${w.is_complete?'':' · 부분 관측'}`:'리뷰 수집 대기';}
function metric(w,label){return `<div class="metric"><small>${label} 추정 판매량</small><span class="value">${w?esc(w.estimated_sales)+'개':'—'}</span><small>${windowText(w)}</small></div>`;}
function render(s){const expanded=new Set([...document.querySelectorAll('#cards details[open]')].map(d=>d.closest('[data-product]').dataset.product+':'+d.querySelector('summary').textContent));$('status').textContent=`${s.keyword} · ${names[s.status]||s.status} · ${s.products.filter(p=>['complete','partial','failed'].includes(p.status)).length}/${s.products.length||10}개 처리 · 요청 10개 / 검색 확보 ${s.products.length}개`;
$('period').textContent=`기준일 ${s.as_of_kst} (한국시간) · 최초 작성일 기준 · 같은 날짜의 1/3개월 전부터 기준일까지 경계 날짜 포함 · 페이지 상한 ${s.max_pages_per_product} · 검색 순위는 광고·개인화에 영향받을 수 있습니다.`;
$('error').textContent=s.error||s.completion_note||'';$('resume').hidden=!(s.status==='interrupted'||s.status==='partial'&&s.products.some(p=>!p.analysis?.coverage?.date_range_complete));$('provenance').textContent=JSON.stringify({model:s.model,base_url:s.base_url,model_calls:s.model_calls,events:s.events},null,2);
$('cards').innerHTML=s.products.map(p=>{const a=p.analysis,w=a&&(a.deduplicated_records!==0||a.coverage.date_range_complete)?a.windows:{},opts=a?.option_groups||[];return `<article data-product="${esc(p.product_id)}"><span class="badge ${esc(p.status)}">${esc(names[p.status]||p.status)}</span><h2>${esc(p.rank)}. <a target="_blank" rel="noopener noreferrer" href="${esc(p.url)}">${esc(p.title)}</a></h2><p>${p.price==null?'가격 미확인':Number(p.price).toLocaleString()+'원'} · 누적 별점/리뷰 ${esc(p.cumulative_reviews)}건</p><div class="metrics">${metric(w['1'],'1개월')}${metric(w['3'],'3개월')}</div>${p.progress?`<small>확인 ${esc(p.progress.page)}쪽 · ${esc(p.progress.records)}건 / 목록 ${esc(p.progress.total)}건</small>`:''}${p.error?`<p class="error">${esc(p.error)}</p>`:''}${a?`<p><a target="_blank" rel="noopener" href="/reports/${jobId}/${esc(p.product_id)}/index.html">원본 근거·상세 집계</a></p><details><summary>구매 옵션 ${opts.length}종 비교</summary><p><small>리뷰에서 관측한 옵션입니다. 옵션별 참여자를 단순 합산하면 전체 인원과 다를 수 있습니다.</small></p><div class="scroll"><table><thead><tr><th>구매 옵션 / ID</th><th>1개월 인원 / 추정량</th><th>3개월 인원 / 추정량</th></tr></thead><tbody>${opts.map(g=>`<tr><td>${esc(g.option_label)}<br><small>${esc(g.item_id||g.option_key)}</small></td>${['1','3'].map(m=>`<td>${esc(g.windows[m].participants_observed_or_inferred)}명 / ${esc(g.windows[m].estimated_sales)}개${g.windows[m].is_complete?'':' (부분)'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><details><summary>수집 범위</summary><pre>${esc(JSON.stringify(a.coverage,null,2))}</pre></details>`:''}</article>`}).join('');document.querySelectorAll('#cards details').forEach(d=>d.open=expanded.has(d.closest('[data-product]').dataset.product+':'+d.querySelector('summary').textContent));}
async function history(){const rows=await api('/api/jobs');$('history').innerHTML='<option value="">작업 선택</option>'+rows.map(r=>`<option value="${esc(r.id)}">${esc(r.keyword)} · ${esc(names[r.status]||r.status)}</option>`).join('');$('history').value=jobId;}
async function poll(){clearTimeout(timer);if(!jobId)return;try{const s=await api('/api/jobs/'+jobId);render(s);if(['queued','running'].includes(s.status))timer=setTimeout(poll,2000);else await history();}catch(e){$('error').textContent=e.message;}}
function select(id){jobId=id;const url=new URL(location);url.searchParams.set('job',id);window.history.replaceState(null,'',url);poll();}
$('search').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('error').textContent='';try{const r=await api('/api/jobs',{keyword:$('keyword').value,max_pages:Number($('maxPages').value)});await history();select(r.id);}catch(e){$('error').textContent=e.message;}finally{$('submit').disabled=false;}};
$('history').onchange=e=>{if(e.target.value)select(e.target.value);};$('resume').onclick=async()=>{try{await api('/api/jobs/'+jobId+'/resume',{max_pages:Number($('maxPages').value)});poll();}catch(e){$('error').textContent=e.message;}};
(async()=>{try{csrf=(await api('/api/bootstrap')).csrf;await history();await poll();document.documentElement.dataset.ready='true';}catch(e){$('error').textContent=e.message;}})();
</script></body></html>
